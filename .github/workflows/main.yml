name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Environment & Accept Licenses
      run: |
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME_17_X64/bin:$PATH" >> $GITHUB_ENV
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip git libltdl-dev
        pip install --upgrade pip
        pip install --upgrade cython==0.29.33 buildozer

    - name: Build with Buildozer
      run: |
        # Automatically pipe 'y' to handle any interactive prompts
        while true; do echo y; sleep 2; done | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-apk
        path: bin/*.apk
